// Wigle-X: userspace USB WiFi monitor-mode drivers, ported from RF Sentinel (github.com/schlaf3r/RFSentinel,
// GPL-3.0; see NOTICE.md for each driver's origin and licence). Runs over Android's USB host API: no root.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    // Kept as RF Sentinel's package so driver fixes can be copied across unchanged.
    namespace "com.rfsentinel.app"
    compileSdk = 36
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        buildConfigField "String", "VERSION_NAME", "\"wigle-x-usbwifi\""
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    testImplementation 'junit:junit:4.13.2'
}
