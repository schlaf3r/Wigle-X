name: Wigle-X APK

# Builds a debug APK of Wigle-X (WiGLE + USB WiFi adapter support) on every push and on demand,
# and attaches it to the run as an artifact.
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Maps API key (placeholder unless the repo has one)
      env:
        MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
      run: echo "MAPS_API_KEY=${MAPS_KEY:-DUMMY}" > ./local.properties
    - name: USB adapter and X-Link module tests
      run: ./gradlew :usbwifi:testDebugUnitTest :xlink:testDebugUnitTest
    - name: Build debug APK
      run: ./gradlew :wiglewifiwardriving:assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: wigle-x-debug-apk
        path: wiglewifiwardriving/build/outputs/apk/debug/*.apk
