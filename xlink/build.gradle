// Wigle-X: X-Link, phones linked over Bluetooth LE (ported from RF Sentinel's Sentinel Link,
// github.com/schlaf3r/RFSentinel, GPL-3.0). Nodes send what they record to the main phone.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "net.wigle.xlink"
    compileSdk = 36
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.17.0"
    testImplementation 'junit:junit:4.13.2'
}
